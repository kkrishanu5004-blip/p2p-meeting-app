<!DOCTYPE html>
<html>
<head>
<title>Ultra-Light Meeting</title>
<style>
body { font-family: sans-serif; background: #111; color: white; text-align: center; margin: 0; padding: 20px; }
.main-layout { display: flex; justify-content: center; gap: 20px; max-width: 1200px; margin: 20px auto; flex-wrap: wrap; }
.video-container { display: flex; flex-direction: column; gap: 15px; width: 60%; min-width: 320px; }
video { width: 100%; background: #222; border-radius: 8px; }
#local-video { transform: scaleX(-1); }

.media-controls { display: flex; justify-content: center; gap: 15px; margin-top: 5px; }
.btn-control { padding: 8px 18px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; color: #fff; font-size: 13px; }
.btn-on { background: #333; border: 1px solid #555; }
.btn-off { background: #dc3545; border: none; }

.chat-container { width: 35%; min-width: 300px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; display: flex; flex-direction: column; height: 500px; }
.chat-messages { flex: 1; padding: 15px; overflow-y: auto; text-align: left; font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
.message { padding: 6px 10px; border-radius: 6px; max-width: 80%; word-break: break-word; }
.msg-me { background: #00ffcc; color: #000; align-self: flex-end; }
.msg-them { background: #333; color: #fff; align-self: flex-start; }
.chat-input-area { padding: 10px; display: flex; gap: 5px; border-top: 1px solid #333; }
.chat-input-area input { flex: 1; padding: 8px; border: none; border-radius: 4px; background: #2b2b2b; color: #fff; }
.chat-input-area button { padding: 8px 15px; background: #00ffcc; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: #000; }

.invite-panel { margin: 15px auto; padding: 10px; width: 320px; background: #222; border-radius: 6px; }
.invite-panel input { width: 90%; padding: 5px; text-align: center; border: none; border-radius: 4px; background: #333; color: #00ffcc; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>

<h2>Ultra-Light P2P Room</h2>

<div id="room-selection">
    <input type="text" id="room-id" placeholder="Generating ID..." style="padding: 5px; text-align: center; font-weight: bold; border-radius: 4px; border: none;">
    <button onclick="joinRoom()" style="padding: 5px 10px; font-weight: bold; border-radius: 4px; border: none; background: #00ffcc; cursor: pointer;">Join / Create Room</button>

    <div class="invite-panel">
        <label style="font-size: 12px; color: #aaa; display: block; margin-bottom: 5px;">Share this Invite Link with your friend:</label>
        <input type="text" id="share-link" value="Loading link..." readonly onclick="this.select(); document.execCommand('copy'); alert('Link copied to clipboard!');">
    </div>
</div>

<div class="main-layout">
    <div class="video-container">
        <video id="local-video" autoplay playsinline muted></video>
        <video id="remote-video" autoplay playsinline></video>

        <div class="media-controls">
            <button id="mute-audio-btn" onclick="toggleAudio()" class="btn-control btn-off">🎤 Mic: OFF</button>
            <button id="mute-video-btn" onclick="toggleVideo()" class="btn-control btn-off">📹 Camera: OFF</button>
        </div>
    </div>

    <div class="chat-container">
        <div style="background: #222; padding: 10px; font-weight: bold; border-bottom: 1px solid #333; font-size: 14px;">💬 Live Room Chat</div>
        <div class="chat-messages" id="chat-box"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-msg" placeholder="Type a message here..." onkeypress="if(event.key === 'Enter') sendTxtMessage()">
            <button onclick="sendTxtMessage()">Send</button>
        </div>
    </div>
</div>

<script>
const randomRoomId = Math.floor(100000 + Math.random() * 900000);
document.getElementById('room-id').value = randomRoomId;

const urlParams = new URLSearchParams(window.location.search);
const sharedRoom = urlParams.get('room');
if (sharedRoom) {
    document.getElementById('room-id').value = sharedRoom;
}

function updateShareLink(baseOrigin) {
    let origin = baseOrigin || window.location.origin;
    const roomId = document.getElementById('room-id').value;
    document.getElementById('share-link').value = origin + "/?room=" + roomId;
}
updateShareLink();
</script>
